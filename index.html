<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MGutterSolutions · Indicadores 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Archivo+Narrow:wght@500;600&display=swap">
<style>
/* Layout: encabezado de marca, fila de KPIs, gráfico semanal ancho, escenarios, dos columnas, tablas */
:root{
  --bg:#f5f7f9; --panel:#ffffff; --fg:#14202b; --muted:#5b6b78; --line:#dde3e8;
  --accent:#1f6f9f; --accent2:#e08a1e; --range:#9fb4c4; --ok:#1d7f4e; --bad:#b4372f;
  --font:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif; --display:"Archivo Narrow","Archivo",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f161c;--panel:#16212a;--fg:#e6edf2;--muted:#93a4b1;--line:#263540;--accent:#5aa9d8;--accent2:#f0a54a;--range:#3f5666;--ok:#4cc38a;--bad:#f07a6f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f161c;--panel:#16212a;--fg:#e6edf2;--muted:#93a4b1;--line:#263540;--accent:#5aa9d8;--accent2:#f0a54a;--range:#3f5666;--ok:#4cc38a;--bad:#f07a6f;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:32px}
header{display:flex;flex-direction:column;gap:10px}
.topbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:40px;height:40px;flex:none}
.brand .name{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--display);font-weight:600;font-size:clamp(28px,4.4vw,40px);line-height:1.1;margin:0;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:20px;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:0}
.lede{max-width:72ch;margin:0;font-size:16px}
.lede b{font-variant-numeric:tabular-nums}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.lbl{font-size:12.5px;color:var(--muted)}
.big{font-family:var(--display);font-weight:600;font-size:28px;line-height:1.15;font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.up{color:var(--ok)} .down{color:var(--bad)}
section{display:flex;flex-direction:column;gap:12px;min-width:0}
.sechead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{font:inherit;font-size:13px;padding:7px 12px;border:0;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff;font-weight:600}
.seg button:focus-visible{outline:2px solid var(--accent2);outline-offset:-2px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.chart{position:relative;width:100%;min-height:300px}
.chart.short{min-height:240px}
.chart svg{display:block;overflow:visible}
.chart text{fill:var(--muted);font-size:12px;font-family:var(--font)}
.chart .tick line{stroke:var(--line)}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);box-shadow:0 6px 20px rgba(0,0,0,.15);border-radius:8px;padding:8px 10px;font-size:12.5px;line-height:1.45;white-space:nowrap;font-variant-numeric:tabular-nums;z-index:2;color:var(--muted)}
.tip strong{color:var(--fg)}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:2px;display:inline-block}
.sw.line{height:3px;border-radius:0}
.scen{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.scen .tile.base{border-color:var(--accent);border-width:2px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:24px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-weight:600;color:var(--muted);background:var(--panel)}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
details{font-size:13px;color:var(--muted)}
details summary{cursor:pointer;color:var(--fg);font-weight:500}
details ul{padding-left:18px;margin:8px 0 0;max-width:80ch}
.fin-head{display:flex;flex-direction:column;gap:6px;border-top:2px solid var(--line);padding-top:24px}
.eyebrow{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.pl td.lab{white-space:nowrap}
.pl tr.sum td{font-weight:600;border-top:2px solid var(--line)}
.pl tr.sec td{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em;background:var(--bg)}
.pl td.neg{color:var(--bad)}
.pl td:first-child,.pl th:first-child{position:sticky;left:0;background:var(--panel)}
.pl tr.sec td:first-child{background:var(--bg)}
.callout{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent2);border-radius:8px;padding:12px 14px;font-size:13px;color:var(--muted);max-width:90ch}
.callout b{color:var(--fg)}
footer{font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
</style>
</head>

<div class="wrap">
  <header>
    <div class="topbar">
      <div class="brand">
        <svg class="mark" viewBox="0 0 40 40" aria-hidden="true"><rect width="40" height="40" rx="9" fill="var(--accent)"/><path d="M8 13h24v5a8 8 0 0 1-8 8h-8a8 8 0 0 1-8-8z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><path d="M26 26v8" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>
        <span class="name">MGutterSolutions</span>
      </div>
      <div class="seg" role="group" aria-label="Idioma / Language" id="lang">
        <button type="button" data-lang="es" aria-pressed="true">Español</button>
        <button type="button" data-lang="en" aria-pressed="false">English</button>
      </div>
    </div>
    <h1 data-i="title"></h1>
    <p class="sub" id="corte"></p>
    <p class="lede" id="lede"></p>
  </header>

  <div class="tiles" id="kpis"></div>

  <section>
    <div class="sechead">
      <div><h2 data-i="weeklyH"></h2><p class="sub" data-i="weeklySub"></p></div>
      <div class="seg" role="group" id="metric">
        <button type="button" data-metric="total" aria-pressed="true" data-i="mTotal"></button>
        <button type="button" data-metric="bigt" aria-pressed="false" data-i="mBigt"></button>
      </div>
    </div>
    <div class="card">
      <div class="chart" id="g-sem"></div>
      <div class="legend">
        <span><i class="sw" style="background:var(--accent)"></i><span data-i="lgWeek"></span></span>
        <span><i class="sw line" style="background:var(--accent2)"></i><span data-i="lgMa"></span></span>
        <span><i class="sw" style="background:var(--range)"></i><span data-i="lgRange"></span></span>
        <span><i class="sw line" style="background:var(--fg)"></i><span data-i="lgBase"></span></span>
      </div>
    </div>
  </section>

  <section>
    <div><h2 data-i="projH"></h2><p class="sub" id="p-sub"></p></div>
    <div class="scen" id="scen"></div>
  </section>


  <div class="fin-head" id="finanzas">
    <span class="eyebrow" data-i="finEyebrow"></span>
    <h2 data-i="finH" style="font-size:26px"></h2>
    <p class="lede" id="fin-lede"></p>
  </div>
  <div class="tiles" id="fin-kpis"></div>
  <section id="promedios">
    <div><h2 data-i="avgH"></h2><p class="sub" data-i="avgSub"></p></div>
    <div class="tiles" id="fin-avg"></div>
  </section>

  <section>
    <div><h2 data-i="finMonthH"></h2><p class="sub" data-i="finMonthSub"></p></div>
    <div class="card">
      <div class="chart" id="g-fin"></div>
      <div class="legend">
        <span><i class="sw" style="background:var(--accent)"></i><span data-i="lgIng"></span></span>
        <span><i class="sw" style="background:var(--range)"></i><span data-i="lgGas"></span></span>
        <span><i class="sw line" style="background:var(--accent2)"></i><span data-i="lgNet"></span></span>
      </div>
    </div>
  </section>

  <div class="grid2">
    <section>
      <div><h2 data-i="finCatH"></h2><p class="sub" data-i="finCatSub"></p></div>
      <div class="card"><div class="chart short" id="g-gcat"></div></div>
    </section>
    <section>
      <div><h2 data-i="finIngH"></h2><p class="sub" data-i="finIngSub"></p></div>
      <div class="card"><div class="chart short" id="g-icat"></div></div>
    </section>
  </div>

  <section>
    <div><h2 data-i="plH"></h2><p class="sub" data-i="plSub"></p></div>
    <div class="tw"><table class="pl"><thead id="pl-head"></thead><tbody id="pl-body"></tbody></table></div>
    <p class="callout" id="fin-note"></p>
  </section>

  <div class="grid2">
    <section>
      <div><h2 data-i="monthH"></h2><p class="sub" data-i="monthSub"></p></div>
      <div class="card"><div class="chart short" id="g-mes"></div></div>
    </section>
    <section>
      <div><h2 data-i="shareH"></h2><p class="sub" data-i="shareSub"></p></div>
      <div class="card"><div class="chart short" id="g-con"></div></div>
    </section>
  </div>

  <section>
    <h2 data-i="detailH"></h2>
    <div class="tw"><table>
      <thead><tr><th data-i="thCon"></th><th class="n" data-i="thJobs"></th><th class="n" data-i="thFt"></th><th class="n" data-i="thTotal"></th><th class="n" data-i="thBigt"></th><th class="n" data-i="thTicket"></th><th class="n" data-i="thShare"></th></tr></thead>
      <tbody id="t-con"></tbody>
    </table></div>
  </section>

  <section>
    <div><h2 data-i="pendH"></h2><p class="sub" data-i="pendSub"></p></div>
    <div class="tw"><table>
      <thead><tr><th data-i="thCon"></th><th class="n" data-i="thJobs"></th><th class="n" data-i="thPend"></th><th class="n" data-i="thPendB"></th></tr></thead>
      <tbody id="t-pend"></tbody>
    </table></div>
  </section>

  <details>
    <summary data-i="notesS"></summary>
    <ul id="notes"></ul>
  </details>
  <footer data-i="footer"></footer>
</div>

    const catAvg = (name, arr) => { const c = gasC.find(x => x.nombre === name); if (!c) return 0; const idx = (arr === 'l3') ? c.valores.slice(-3) : c.valores; return -d3.mean(idx); };
    const catTot = (name) => (gasC.find(x => x.nombre === name) || {total: 0}).total;
    const mMin = d3.min(fMonths, r => r.net / r.ing), mMax = d3.max(fMonths, r => r.net / r.ing);
    [[t.aIng, money(avg(r => r.ing)), t.aL3(money(avg(r => r.ing, l3)))],
     [t.aGas, money(avg(r => r.gas)), t.aL3(money(avg(r => r.gas, l3)))],
     [t.aNet, money(avg(r => r.net)), t.aL3(money(avg(r => r.net, l3)))],
     [t.aMar, pct(fMargin * 100), t.aL3(pct(d3.sum(l3, r => r.net) / d3.sum(l3, r => r.ing) * 100)) + ' · ' + t.aRange(pct(mMin * 100), pct(mMax * 100))],
     [t.aMat, money(catAvg('Materiales y herramientas')), t.aShare(pct(catTot('Materiales y herramientas') / fGas * 100)) + ' · ' + t.aL3(money(catAvg('Materiales y herramientas', 'l3')))],
     [t.aLab, money(catAvg('Mano de obra y subcontratistas')), t.aShare(pct(catTot('Mano de obra y subcontratistas') / fGas * 100)) + ' · ' + t.aL3(money(catAvg('Mano de obra y subcontratistas', 'l3')))]]
      .forEach(([l, v, n]) => { const c = el('div', 'tile'); c.append(el('span', 'lbl', l), el('span', 'big', v), el('span', 'note', n)); A.append(c); });
    const H = document.getElementById('pl-head'), Bd = document.getElementById('pl-body');
    const hr = el('tr'); hr.append(el('th', null, '')); FM.forEach(d => hr.append(el('th', 'n', t.months[d.getUTCMonth()]))); hr.append(el('th', 'n', t.plTotal)); H.replaceChildren(hr);
    Bd.replaceChildren();
    const fmt = (v) => v === 0 ? '–' : money(v);
    const line = (label, vals, cls, f) => { const tr = el('tr', cls || ''); tr.append(el('td', 'lab', label));
      vals.concat([d3.sum(vals)]).forEach((v, i) => { const td = el('td', 'n' + (v < 0 ? ' neg' : ''), (f || fmt)(v, i)); tr.append(td); }); Bd.append(tr); };
    const sec = (label) => { const tr = el('tr', 'sec'); const td = el('td', null, label); td.colSpan = FM.length + 2; tr.append(td); Bd.append(tr); };
    sec(t.plIng); ingC.forEach(c => line(cn(c.nombre), c.valores));
    line(t.plTotIng, fMonths.map(r => r.ing), 'sum');
    sec(t.plGas); gasC.forEach(c => line(cn(c.nombre), c.valores.map(v => -v)));
    line(t.plTotGas, fMonths.map(r => r.gas), 'sum');
    line(t.plNet, fMonths.map(r => r.net), 'sum');
    const tr = el('tr'); tr.append(el('td', 'lab', t.plMargin)); fMonths.forEach(r => tr.append(el('td', 'n' + (r.net < 0 ? ' neg' : ''), pct(r.net / r.ing * 100)))); tr.append(el('td', 'n', pct(fMargin * 100))); Bd.append(tr);
    sec(t.plBelow); fuera.filter(c => Math.abs(c.total) >= 1).forEach(c => line(cn(c.nombre), c.valores));
    const note = document.getElementById('fin-note'); note.replaceChildren(el('b', null, t.finNote[0]), t.finNote[1]);
  }

  function drawFin(){
    const t = L(), box = document.getElementById('g-fin'); box.replaceChildren();
    const W = box.clientWidth, H = 300, m = {t: 14, r: 6, b: 26, l: 8};
    const svg = d3.select(box).append('svg').attr('width', W).attr('height', H).attr('viewBox', `0 0 ${W} ${H}`).attr('role', 'img').attr('aria-label', t.finMonthH);
    const y = d3.scaleLinear().domain([Math.min(0, d3.min(fMonths, r => r.net)), d3.max(fMonths, r => Math.max(r.ing, r.gas))]).nice().range([H - m.b, m.t]);
    const gy = svg.append('g').call(d3.axisLeft(y).ticks(5).tickFormat(mk)); let lw = 0; gy.selectAll('text').each(function(){ lw = Math.max(lw, this.getComputedTextLength()); }); gy.remove();
    m.l = lw + 12;
    const x = d3.scaleBand().domain(fMonths.map(r => +r.d)).range([m.l, W - m.r]).padding(0.22);
    const x1 = d3.scaleBand().domain(['ing', 'gas']).range([0, x.bandwidth()]).padding(0.08);
    svg.append('g').attr('transform', `translate(${m.l},0)`).call(d3.axisLeft(y).ticks(5).tickFormat(mk).tickSize(-(W - m.l - m.r))).call(g => g.select('.domain').remove());
    svg.append('g').attr('transform', `translate(0,${y(0)})`).call(d3.axisBottom(x).tickFormat(d => t.months[new Date(d).getUTCMonth()]).tickSize(0).tickPadding(8)).call(g => g.select('.domain').attr('stroke', css('--line')))
      .selectAll('text').attr('y', (d) => (y(0) < H - m.b - 4 ? (H - m.b - y(0)) + 8 : 8));
    const g = svg.append('g');
    g.selectAll('rect.i').data(fMonths).join('rect').attr('x', r => x(+r.d) + x1('ing')).attr('width', x1.bandwidth()).attr('y', r => y(r.ing)).attr('height', r => y(0) - y(r.ing)).attr('rx', 2).attr('fill', css('--accent'));
    g.selectAll('rect.g').data(fMonths).join('rect').attr('x', r => x(+r.d) + x1('gas')).attr('width', x1.bandwidth()).attr('y', r => y(r.gas)).attr('height', r => y(0) - y(r.gas)).attr('rx', 2).attr('fill', css('--range'));
    svg.append('path').datum(fMonths).attr('fill', 'none').attr('stroke', css('--accent2')).attr('stroke-width', 2.5).attr('d', d3.line().x(r => x(+r.d) + x.bandwidth() / 2).y(r => y(r.net)));
    svg.append('g').selectAll('circle').data(fMonths).join('circle').attr('cx', r => x(+r.d) + x.bandwidth() / 2).attr('cy', r => y(r.net)).attr('r', 3.5).attr('fill', css('--accent2'));
    const tp = tipper(box);
    svg.append('g').selectAll('rect').data(fMonths).join('rect').attr('x', r => x(+r.d) - x.step() * x.padding() / 2).attr('width', x.step()).attr('y', m.t).attr('height', H - m.t - m.b).attr('fill', 'transparent')
      .on('pointerenter', (ev, r) => tp.show([[t.monthsL[r.d.getUTCMonth()] + ' 2026', 1], [t.lgIng + ': ' + money(r.ing)], [t.lgGas + ': ' + money(r.gas)], [t.lgNet + ': ' + money(r.net) + ' (' + pct(r.net / r.ing * 100) + ')']], x(+r.d) + x.bandwidth() / 2, y(Math.max(r.ing, r.gas))))
      .on('pointerleave', () => tp.hide());
  }

  function hbars(id, list, total, otherKey, aria){
    const t = L(), box = document.getElementById(id); box.replaceChildren();
    const rows = group(list, 7, otherKey), W = box.clientWidth, rh = 26, H = rows.length * rh + 4;
    const svg = d3.select(box).append('svg').attr('width', W).attr('height', H).attr('viewBox', `0 0 ${W} ${H}`).attr('role', 'img').attr('aria-label', aria);
    const names = svg.append('g').selectAll('text').data(rows).join('text').attr('y', (r, i) => i * rh + rh / 2 + 4).text(r => cn(r.nombre));
    let nw = 0; names.each(function(){ nw = Math.max(nw, this.getComputedTextLength()); });
    const probe = svg.append('text').text('100.0 %  $000.0 k'); const vw = probe.node().getComputedTextLength(); probe.remove();
    const x0 = nw + 10, x = d3.scaleLinear().domain([0, d3.max(rows, r => r.total)]).range([0, Math.max(20, W - x0 - vw - 10)]);
    svg.append('g').selectAll('rect').data(rows).join('rect').attr('x', x0).attr('y', (r, i) => i * rh + 5).attr('height', rh - 10).attr('width', r => x(Math.max(0, r.total))).attr('rx', 2).attr('fill', r => r.otros ? css('--range') : css('--accent'));
    svg.append('g').selectAll('text').data(rows).join('text').attr('x', r => x0 + x(Math.max(0, r.total)) + 6).attr('y', (r, i) => i * rh + rh / 2 + 4).style('fill', css('--fg')).text(r => pct(r.total / total * 100) + '  ' + mk(r.total));
  }
  function drawCats(){ const t = L(); hbars('g-gcat', gasC, fGas, 'Otros gastos', t.finCatH); hbars('g-icat', ingC, fIng, 'Otros', t.finIngH); }

  document.querySelectorAll('#metric button').forEach(bt => bt.addEventListener('click', () => {
    metric = bt.dataset.metric; document.querySelectorAll('#metric button').forEach(q => q.setAttribute('aria-pressed', String(q === bt))); drawSem(); }));
  const drawAll = () => { drawSem(); drawMes(); drawCon(); drawFin(); drawCats(); };
  document.querySelectorAll('#lang button').forEach(bt => bt.addEventListener('click', () => {
    if (bt.dataset.lang === lang) return; lang = bt.dataset.lang;
    try { localStorage.setItem('mgs-lang', lang); } catch (e) {}
    try { const u = new URL(location.href); u.searchParams.set('lang', lang); history.replaceState(null, '', u); } catch (e) {}
    renderText(); renderFin(); drawAll(); }));
  renderText(); renderFin(); drawAll();
  let rw; addEventListener('resize', () => { clearTimeout(rw); rw = setTimeout(drawAll, 150); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', drawAll);
})();
</script>
